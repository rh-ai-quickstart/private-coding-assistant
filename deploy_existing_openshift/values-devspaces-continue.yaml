# Opt-in Continue/Roo/Cline DevWorkspace (che-code UDI image).
# Deploy with: TYPE=continue DEV_USER=<username> make devspace-deploy-existing-openshift ...
devspacesGlobalConfig:
  enabled: true
maas:
  enabled: true
  gatewayClassName: openshift-default
aiGateway:
  enabled: false
  escapeHatchToLlmd: false
  apiKeySecretName: pca-maas-apikey
opencodeBuild:
  enabled: false
devspaces:
  - name: code-workspace-1
    user: dev-user1
    type: continue
    # team: optional — set per developer for Langfuse team attribution
