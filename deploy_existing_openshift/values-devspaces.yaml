# Values override for pca-devspaces when deploying on an existing OpenShift cluster.
# Single OpenCode devspace — namespace defaults to Release.Namespace (passed via --namespace).
# Opt into Continue/Roo/Cline with TYPE=continue (values-devspaces-continue.yaml).
tokens:
  total: 32000
  output: 8192
devspacesGlobalConfig:
  enabled: true
# IDE traffic defaults to maas-default-gateway (RHCL + API keys).
# Existing OpenShift Gateway class is openshift-default (not ROSA/ARO
# data-science-gateway-class). ClusterIP is {gateway}-{class}.
maas:
  enabled: true
  gatewayClassName: openshift-default
aiGateway:
  enabled: false
  escapeHatchToLlmd: false
  apiKeySecretName: pca-maas-apikey
opencodeBuild:
  enabled: true
  opencodeVersion: "1.15.13"
devspaces:
  - name: code-workspace-1
    user: dev-user1
    type: opencode
    # team: optional — set per developer for Langfuse team attribution
