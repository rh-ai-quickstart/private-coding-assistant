# Values override for deploying pca-platform-config on an existing OpenShift cluster.
# Disables cluster-scoped resources (DSC, DSCI, ClusterPolicy, etc.) that are already present.
# Disables devspace namespace/RBAC creation (handled by --create-namespace in devspace target).

clusterConfig:
  enabled: false
devspaces:
  enabled: false
  # instances: PLACEHOLDER — replaced entirely by
  #   make devspace-deploy-existing-openshift N=<count>
  # which calls sync_platform_instances() in:
  #   deploy_existing_openshift/scripts/devspace-deploy.sh
  # (dev-user1..N, passwords DevN@PCA2026!). Then run make setup-idp.
  # Do not commit real demo user lists here; N= is the source of truth.
  instances:
    - namespace: PLACEHOLDER-overwritten-by-N
      name: PLACEHOLDER
      user: PLACEHOLDER
      password: PLACEHOLDER-run-make-devspace-deploy-N-then-setup-idp
guardrails:
  enabled: true
# Guardrails sub-chart config (enabled by default). Secret patterns: files/secret-patterns.yaml
# Overrides: files/secret-patterns-overrides.yaml
pca-guardrails:
  namespace: ai-serving
  guardrails:
    enforcement: block
    llmService:
      host: qwen3-coder-kserve-workload-svc
      port: 8000
      tlsSecret: qwen3-coder-kserve-self-signed-certs
    replicas: 1
    gateway:
      enabled: false
    proxy:
      enabled: true
    detectors:
      promptInjection:
        enabled: true
        model: protectai/deberta-v3-base-prompt-injection-v2
        threshold: 0.5
        useGpu: false
      piiRegex:
        enabled: true
      secretsRegex:
        enabled: true
    otel:
      enabled: false
# HTPasswd IDP is not created via Helm on existing clusters (OAuth CR is managed externally).
# Run `make setup-idp` to configure HTPasswd IDP via the additive patch script.
auth:
  htpasswd:
    enabled: false
