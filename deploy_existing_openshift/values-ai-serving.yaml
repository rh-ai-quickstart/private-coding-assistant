# Values override for pca-ai-serving when deploying on an existing OpenShift cluster.
clusterResources: false
# Namespace-tenancy Thanos (:9092) — no cluster-monitoring-view required
pca-observability:
  prometheus:
    accessMode: namespace
tokens:
  total: 32000
  output: 8192
vllm:
  # L40S 48GB: skip CUDA graphs so KV profiling fits after ~34GiB MoE weights.
  # Override to false on 80GB+ GPUs if you want max throughput.
  enforceEager: true
  extraEnv:
    HF_HOME: "/model-cache"
    # Ignored at render: chart PVC lookup sets HF_HUB_OFFLINE (cold/warm).
    HF_HUB_OFFLINE: "0"
    TRITON_CACHE_DIR: "/model-cache/triton-cache"
    XDG_CACHE_HOME: "/model-cache/xdg-cache"
    HOME: "/tmp"
    DG_JIT_CACHE_DIR: "/model-cache/deep-gemm"
    VLLM_CACHE_ROOT: "/model-cache/vllm-cache"
# Self-signed cert for llm-d / RHCL gateways (LLMInferenceService no longer creates kserve-self-signed-certs).
tlsJob:
  enabled: true
# RHCL front door (requires RHCL operator already on cluster; chart creates Kuadrant CR).
aiGateway:
  enabled: true
  escapeHatchToLlmd: false
  tls:
    secretName: llm-d-gateway-tls
  kuadrant:
    create: true
