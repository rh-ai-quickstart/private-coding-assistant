# Values override for pca-ai-serving when deploying on an existing OpenShift cluster.
clusterResources: false
# Namespace-tenancy Thanos (:9092) — no cluster-monitoring-view required
pca-observability:
  prometheus:
    accessMode: namespace
tokens:
  total: 32000
  output: 8192
vllm:
  # L40S 48GB + Qwen3.6 MoE FP8: CUDA graphs for decode throughput.
  # FULL_DECODE_ONLY + expandable alloc: full cudagraph profile OOMs by ~1GiB on L40S.
  kvCacheDtype: "fp8"
  gpuMemoryUtilization: "0.90"
  # extraArgs: inherited from charts/pca-ai-serving/values.yaml (ROSA/ARO/existing).
  extraEnv:
    HF_HOME: "/model-cache"
    # Ignored at render: chart always sets HF_HUB_OFFLINE=1 for LLMIS local-path load.
    HF_HUB_OFFLINE: "0"
    TRITON_CACHE_DIR: "/model-cache/triton-cache"
    XDG_CACHE_HOME: "/model-cache/xdg-cache"
    HOME: "/tmp"
    DG_JIT_CACHE_DIR: "/model-cache/deep-gemm"
    VLLM_CACHE_ROOT: "/model-cache/vllm-cache"
    # PYTORCH_CUDA_ALLOC_CONF: inherited from charts/pca-ai-serving/values.yaml
# Self-signed cert for llm-d gateway (LLMInferenceService no longer creates kserve-self-signed-certs).
tlsJob:
  enabled: true
# MaaS front door. pca-platform-config owns Gateway+TLS (maas.gateway.create).
# Pass --set maas.hostname=<Gateway/Route host> via HELM_ARGS when known (do not commit it here).
maas:
  enabled: true
  kuadrant:
    create: true
aiGateway:
  tls:
    secretName: llm-d-gateway-tls
# Guardrails workloads (TrustyAI operator toggle stays in pca-platform-config cluster.trustyai).
# llmService host/port/tlsSecret: inherited (llm-d HTTP :80, or pca-semantic-router when SR is on).
# Extra OpenAI-compatible backends only — do not list local Qwen (Helm injects model.id).
# semanticRouter:
#   enabled: true
#   models:
#     - name: cloud
#       strength: strong
#       endpoint: https://api.example.com/v1
#       modelId: gpt-4o
#   apiKeysJson: '{"cloud":"sk-..."}'
guardrails:
  enabled: true
