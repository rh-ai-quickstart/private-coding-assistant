namespace: ai-serving
clusterConfig:
  enabled: true
# TrustyAI operator (guardrails workloads deploy via pca-ai-serving subchart).
cluster:
  trustyai:
    enabled: true
devspaces:
  enabled: true
  instances:
    - namespace: dev-user1-devspaces
      name: code-workspace-1
      user: dev-user1
      password: ""
    - namespace: dev-user2-devspaces
      name: code-workspace-2
      user: dev-user2
      password: ""
    - namespace: dev-user3-devspaces
      name: code-workspace-3
      user: dev-user3
      password: ""
hfToken:
  raw: "__overridden_at_deploy_time__"
auth:
  htpasswd:
    enabled: false
    providerName: "pca-htpasswd"
mcp:
  enabled: false
# MaaS Gateway identity. This chart owns Gateway+TLS when maas.gateway.create
# (default true). Independent of clusterConfig.enabled so existing OpenShift
# still gets the Gateway when DSC/NFD stay off.
maas:
  gateway:
    create: true
  gatewayName: maas-default-gateway
  gatewayNamespace: openshift-ingress
  gatewayClassName: data-science-gateway-class
  tls:
    secretName: maas-default-gateway-tls
# Sub-chart: pca-mcp (MCP Lifecycle Operator CRs + MCP Gateway — RHOAI 3.4, Developer/Tech Preview)
# Values here are passed to PCA_Deployment_ROSA/charts/pca-platform-config/charts/pca-mcp/
pca-mcp:
  namespace: ai-serving
  imageRegistry: quay.io
  openshift:
    enabled: true
    # Image from the Red Hat MCP Catalog (UBI-based, vulnerability-scanned)
    image: quay.io/redhat-user-workloads/ocp-mcp-server-tenant/openshift-mcp-server-release-03:latest
  mariadb:
    enabled: false
    host: ""
    secretName: ""
  gateway:
    enabled: true
