{{- if .Values.tlsJob.enabled }}
# Job to generate a self-signed TLS certificate shared by both Gateways
# (llm-d-gateway and pca-ai-gateway both terminate TLS with this secret —
# see .Values.aiGateway.tls.secretName). Runs once after the namespace is
# created, before the Gateways sync (sync-wave 3) so certificateRefs resolve.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-gateway-tls
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: create-tls
          image: registry.access.redhat.com/ubi9/ubi:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              SECRET_NAME="{{ .Values.aiGateway.tls.secretName | default "qwen3-coder-kserve-self-signed-certs" }}"
              LLMD_HOST="{{ .Values.tlsJob.gatewayHostname | default (printf "llm-d-gateway-data-science-gateway-class.%s.svc.cluster.local" .Values.namespace) }}"
              AIGW_HOST="{{ printf "%s-data-science-gateway-class.%s.svc.cluster.local" .Values.aiGateway.name .Values.namespace }}"
              # CN is limited to 64 chars; put full FQDNs in SAN instead
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /tmp/tls.key -out /tmp/tls.crt \
                -subj "/CN=ai-gateway" \
                -addext "subjectAltName=DNS:${LLMD_HOST},DNS:${AIGW_HOST}"

              cat <<EOF > /tmp/secret.json
              {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {
                  "name": "${SECRET_NAME}",
                  "namespace": "{{ .Values.namespace }}"
                },
                "type": "kubernetes.io/tls",
                "data": {
                  "tls.crt": "$(base64 -w0 /tmp/tls.crt)",
                  "tls.key": "$(base64 -w0 /tmp/tls.key)"
                }
              }
              EOF

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              APISERVER=https://kubernetes.default.svc

              curl -sf -X POST \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                --cacert ${CACERT} \
                "${APISERVER}/api/v1/namespaces/{{ .Values.namespace }}/secrets" \
                -d @/tmp/secret.json || \
              curl -sf -X PUT \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                --cacert ${CACERT} \
                "${APISERVER}/api/v1/namespaces/{{ .Values.namespace }}/secrets/${SECRET_NAME}" \
                -d @/tmp/secret.json

              echo "TLS secret ${SECRET_NAME} created/updated successfully"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-secret-creator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-secret-creator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: tls-secret-creator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
