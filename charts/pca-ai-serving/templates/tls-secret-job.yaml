{{- if .Values.tlsJob.enabled }}
{{- $secretName := .Values.aiGateway.tls.secretName | default "ai-gateway-self-signed-certs" }}
{{- $llmdHost := .Values.tlsJob.gatewayHostname | default (printf "%s.%s.svc.cluster.local" (include "pca-ai-serving.llmdGatewayService" .) .Values.namespace) }}
# Self-signed TLS for llm-d-gateway. MaaS TLS is a separate Job in
# openshift-ingress (pca-platform-config). See .Values.aiGateway.tls.secretName.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-gateway-tls
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: create-tls
          image: registry.access.redhat.com/ubi9/ubi:latest
          command:
            - /bin/bash
            - -c
            - |
{{- include "pca-ai-serving.upsertTlsSecretScript" (dict "namespace" .Values.namespace "secretName" $secretName "cn" "llm-d-gateway" "san" (printf "DNS:%s" $llmdHost)) | nindent 14 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-secret-creator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-secret-creator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: tls-secret-creator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
