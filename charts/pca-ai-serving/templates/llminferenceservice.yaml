# LLMInferenceService — sole serving path (custom vLLM image via vllm.image).
# Carries ServingRuntime + InferenceService parity (args, env, volumes, probes).
# Router: gateway + route only (no scheduler/EPP). Langfuse OTLP + I/O when enabled.
{{- include "pca-ai-serving.langfuse.validate" . -}}
{{- $langfuseEnabled := eq (include "pca-ai-serving.langfuseEnabled" .) "true" -}}
{{- $ioCapture := include "pca-ai-serving.langfuseIoCapture" . -}}
{{- $ioFull := and $langfuseEnabled (eq $ioCapture "full") }}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    security.opendatahub.io/enable-auth: "false"
spec:
  replicas: 1
  model:
    uri: hf://{{ .Values.model.id }}
    name: {{ .Values.model.id }}
  router:
    route: {}
    gateway:
      refs:
        - name: {{ .Values.gatewayName | default "llm-d-gateway" }}
          namespace: {{ .Values.gatewayNamespace | default .Values.namespace }}
  template:
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      {{- if $ioFull }}
      - name: pca-langfuse-io
        configMap:
          name: pca-langfuse-io-middleware
      {{- end }}
    containers:
      - name: main
        {{- if .Values.vllm.image }}
        image: {{ .Values.vllm.image }}
        {{- end }}
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --port=8000
          # Storage-initializer writes weights onto the PVC (mounted at /model-cache).
          - --model=/model-cache
          - --served-model-name={{ .Values.model.servedName | default .Values.model.id }}
          - --trust-remote-code
          - --tensor-parallel-size={{ .Values.hardware.gpuCount }}
          - --max-model-len={{ include "pca-ai-serving.tokens.total" . }}
          - --enable-prefix-caching
          - --enable-auto-tool-choice
          - --tool-call-parser={{ .Values.vllm.toolCallParser }}
          - --reasoning-parser={{ .Values.vllm.reasoningParser }}
          {{- if .Values.vllm.kvCacheDtype }}
          - --kv-cache-dtype={{ .Values.vllm.kvCacheDtype }}
          {{- end }}
          {{- if .Values.vllm.gpuMemoryUtilization }}
          - --gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}
          {{- end }}
          {{- if not .Values.vllm.enableThinking }}
          # vLLM >= 0.19: --default-chat-template-kwargs (not --chat-template-kwargs).
          - --default-chat-template-kwargs={"enable_thinking":false}
          {{- end }}
          {{- if $langfuseEnabled }}
          - --otlp-traces-endpoint=http://pca-otel-collector.{{ .Values.namespace }}.svc.cluster.local:4317
          - --collect-detailed-traces=all
          {{- end }}
          {{- if $ioFull }}
          - --middleware
          - pca_langfuse_io.langfuse_io_middleware
          {{- end }}
          {{- range .Values.vllm.extraArgs }}
          - {{ . | quote }}
          {{- end }}
          # Cluster enableLLMInferenceServiceTLS=true injects HTTPS probes +
          # /var/run/kserve/tls certs; vLLM must serve TLS on :8000.
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
        env:
          {{- if $langfuseEnabled }}
          - name: OTEL_SERVICE_NAME
            value: vllm-{{ .Values.model.name }}
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://pca-otel-collector.{{ .Values.namespace }}.svc.cluster.local:4317
          - name: OTEL_TRACES_SAMPLER
            value: always_on
          {{- end }}
          {{- if $ioFull }}
          - name: PYTHONPATH
            value: /opt/pca
          - name: PCA_LANGFUSE_IO_CAPTURE
            value: {{ $ioCapture | quote }}
          - name: LANGFUSE_BASE_URL
            value: http://pca-langfuse-web.{{ .Values.namespace }}.svc.cluster.local:3000
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: pca-langfuse-credentials
                key: init-project-public-key
          - name: LANGFUSE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: pca-langfuse-credentials
                key: init-project-secret-key
          {{- end }}
          - name: HF_HUB_OFFLINE
            value: {{ include "pca-ai-serving.hfHubOffline" . | quote }}
          {{- range $key, $val := .Values.vllm.extraEnv }}
          {{- if ne $key "HF_HUB_OFFLINE" }}
          - name: {{ $key }}
            value: {{ $val | quote }}
          {{- end }}
          {{- end }}
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 120
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 10
        volumeMounts:
          - name: kserve-provision-location
            mountPath: /model-cache
          - name: shm
            mountPath: /dev/shm
          {{- if $ioFull }}
          - name: pca-langfuse-io
            mountPath: /opt/pca
            readOnly: true
          {{- end }}
        resources:
          limits:
            cpu: {{ .Values.hardware.cpu.limit | quote }}
            memory: {{ .Values.hardware.memory.limit }}
            nvidia.com/gpu: {{ .Values.hardware.gpuCount | quote }}
          requests:
            cpu: {{ .Values.hardware.cpu.request | quote }}
            memory: {{ .Values.hardware.memory.request }}
            nvidia.com/gpu: {{ .Values.hardware.gpuCount | quote }}
    nodeSelector:
      {{ .Values.hardware.instanceTypeLabel }}: {{ .Values.hardware.gpuProduct }}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: g6e-gpu
        operator: Exists
        effect: NoSchedule
