{{- $ns := .Values.namespace }}
{{- $existing := lookup "v1" "PersistentVolumeClaim" $ns "model-cache" }}
{{- if not $existing }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Keep model weights across helm uninstall / release recreation.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.modelCacheSize }}
{{- end }}
