apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-gateway
  namespace: {{ .Values.namespace }}
  labels:
    istio.io/rev: openshift-gateway
  annotations:
    # Auth is enforced at the MaaS / RHCL front door (maas-default-gateway AuthPolicy).
    # Keep ODH from recreating kubernetesTokenReview AuthPolicies on this Gateway.
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ .Values.aiGateway.tls.secretName | default "ai-gateway-self-signed-certs" }}
        kind: Secret
    allowedRoutes:
      namespaces:
        from: Same
  # ClusterIP HTTP for TrustyAI. Operator does not mount tlsSecrets, so HTTPS to llm-d fails CA verify.
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
