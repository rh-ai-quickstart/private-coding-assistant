# Catch-all route on llm-d-gateway → LLMIS workload Service.
# LLMIS also creates a namespaced-path HTTPRoute; RHCL and smoke expect /v1 at the root.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-gateway-route
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
  - name: {{ .Values.gatewayName | default "llm-d-gateway" }}
    namespace: {{ .Values.gatewayNamespace | default .Values.namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.model.name }}-{{ .Values.model.workloadServiceSuffix | default "kserve-workload-svc" }}
      port: {{ .Values.model.workloadServicePort | default 8000 }}
    timeouts:
      request: "0s"
      backendRequest: "0s"
