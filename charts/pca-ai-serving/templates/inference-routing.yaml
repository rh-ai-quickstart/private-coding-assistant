{{- if .Values.epp.enabled }}
# InferencePool — scalable model routing through EPP.
#
# InferencePool selects vLLM predictor pods by label and routes through the
# EPP for intelligent scheduling. When multiple replicas are running, EPP
# uses queue depth + prefix cache scoring to pick the optimal replica.
#
# To scale: increase LLMInferenceService spec.replicas (or add HPA).
# The InferencePool automatically discovers new pods via label selector.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ include "pca-ai-serving.model.poolName" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pca-ai-serving.model.name" . }}
      app.kubernetes.io/part-of: llminferenceservice
      kserve.io/component: workload
  endpointPickerRef:
    failureMode: FailOpen
    group: ""
    kind: Service
    name: llm-d-epp
    port:
      number: 9002
{{- end }}
