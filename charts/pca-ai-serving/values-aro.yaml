# ARO-specific overrides — model/vLLM/hardware defaults inherit from base values.yaml.
model:
  name: "qwen3-coder"
  poolName: "qwen3-coder-inference-pool"
  workloadServiceSuffix: "predictor"
  workloadServicePort: 80
hardware:
  gpuProduct: "NVIDIA-H100-NVL"
  instanceTypeLabel: "nvidia.com/gpu.product"
storage:
  storageClass: "managed-csi"
  modelCacheSize: 100Gi
epp:
  # InferencePool/InferenceModel CRDs missing on RHOAI 3.3.1 — re-enable once ARO upgrades
  enabled: false
tlsJob:
  enabled: true
aiGateway:
  enabled: true
  tls:
    secretName: "llm-d-gateway-tls"
observability:
  enabled: true
pca-observability:
  namespace: ai-serving
  grafana:
    enabled: true
  langfuse:
    enabled: true
    ioCapture: full
  prometheus:
    accessMode: namespace
  cost:
    gpuHourlyUsd: 4.50
    gpuHourlyUsdIsPlaceholder: true
