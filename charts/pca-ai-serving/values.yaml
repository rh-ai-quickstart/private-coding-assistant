namespace: ai-serving
clusterResources: true
model:
  # Which coding model to deploy. "qwen3.6" (default) is a pure passthrough of
  # the id/name/poolName/vllm.* fields below — set to "qwen3.8" to switch to
  # Qwen/Qwen3.8-27B-FP8, which overrides those fields via chart-native presets
  # (see templates/_helpers.tpl). Only one model runs at a time: concurrently
  # serving both behind the same AI Gateway triggers a Kuadrant EnvoyFilter-
  # ordering bug that OOM-crashes llm-d-gateway. Terraform surfaces this as
  # `model_variant` (see PCA_Deployment_ROSA|ARO/terraform/variables.tf).
  variant: "qwen3.6"
  id: "Qwen/Qwen3.6-35B-A3B-FP8"
  servedName: "" # empty = use model.id as the vLLM --served-model-name
  name: "qwen3-coder"
  poolName: "qwen3-coder-inference-pool"
  # LLMInferenceService workload Service: <name>-kserve-workload-svc:8000.
  workloadServiceSuffix: "kserve-workload-svc"
  workloadServicePort: 8000
# Shared token budgets (vLLM --max-model-len + IDE/OpenCode completion caps).
# Keep OpenCode/Continue limits in pca-devspaces aligned with these values.
tokens:
  total: 32000 # context window / --max-model-len
  output: 8192 # max completion tokens (must be < total)
vllm:
  # Deprecated alias: templates prefer tokens.total. Kept for --set compatibility.
  maxModelLen: ""
  toolCallParser: "qwen3_xml"
  reasoningParser: "qwen3"
  image: "vllm/vllm-openai:v0.19.0"
  # Writable cache dirs for non-root containers (upstream vLLM image).
  extraEnv:
    HF_HOME: "/model-cache"
    # HF_HUB_OFFLINE is always 1 for LLMIS local-path load. Kept for docs / --set clarity.
    HF_HUB_OFFLINE: "0"
    TRITON_CACHE_DIR: "/model-cache/triton-cache"
    XDG_CACHE_HOME: "/model-cache/xdg-cache"
    HOME: "/tmp"
    DG_JIT_CACHE_DIR: "/model-cache/deep-gemm"
    VLLM_CACHE_ROOT: "/model-cache/vllm-cache"
    # Companion to FULL_DECODE_ONLY cudagraphs in extraArgs — reduces fragmentation
    # OOM during capture on 48GB (ROSA L40S / existing OpenShift); harmless on H100.
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # Set false to disable Qwen3 thinking mode (adds --default-chat-template-kwargs).
  # Use false when the model's thinking blocks exceed test max_tokens budgets.
  enableThinking: true
  # Optional vLLM --gpu-memory-utilization (empty = vLLM default / omit flag).
  gpuMemoryUtilization: ""
  # FP8 KV cache. Frees VRAM vs auto/fp16 KV.
  kvCacheDtype: "fp8"
  # Extra vLLM CLI args (appended after chart defaults on LLMInferenceService).
  # Shared by ROSA / ARO / existing OpenShift.
  # Qwen3.6 hybrid (Mamba) needs max-num-batched-tokens >= block_size (~2096).
  # FULL_DECODE_ONLY + capped capture size: avoids full-cudagraph OOM on 48GB
  # (L40S); still valid on larger GPUs (e.g. ARO H100).
  extraArgs:
    - --max-num-batched-tokens=16384
    - --performance-mode=throughput
    - '--compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":32}'
hardware:
  gpuProduct: "g6e.2xlarge"
  instanceTypeLabel: "node.kubernetes.io/instance-type"
  gpuCount: 1
  cpu:
    request: "2"
    limit: "4"
  memory:
    request: 16Gi
    limit: 48Gi
storage:
  storageClass: "gp3-csi"
  modelCacheSize: 100Gi
epp:
  enabled: false
tlsJob:
  enabled: false
  gatewayHostname: ""
gatewayName: llm-d-gateway
# RHCL / MaaS front door. Kuadrant still enforces AuthPolicy on PCA's HTTPRoute.
# semanticRouter.enabled=false pins TrustyAI / guardrails at llm-d HTTP :80 (not raw vLLM TLS :8000).
aiGateway:
  gatewayClassName: data-science-gateway-class
  tls:
    # Independent self-signed cert (see templates/tls-secret-job.yaml) for
    # llm-d-gateway HTTPS. Not derived from or owned by any
    # LLMInferenceService/model — the name is deployment-wide, not model-specific,
    # so switching model.variant never requires changing this.
    secretName: ai-gateway-self-signed-certs
maas:
  enabled: true
  gatewayName: maas-default-gateway
  gatewayNamespace: openshift-ingress
  gatewayClassName: data-science-gateway-class
  # Public Gateway/Route host. Empty (existing-OpenShift default) omits HTTPRoute
  # hostnames and matches Istio catch-all *:443. Pass via HELM_ARGS when known:
  #   oc get gateway maas-default-gateway -n openshift-ingress
  # Do not commit a cluster-specific hostname in values files.
  hostname: ""
  # Gateway+TLS live in pca-platform-config (maas.gateway.create there).
  kuadrant:
    create: false
    namespace: kuadrant-system
    name: kuadrant
  virtualModel: pca-auto
  groupName: pca-developers
  tokenLimit:
    hourly: 5000000
    daily: 50000000
  tls:
    secretName: maas-default-gateway-tls
# Official vLLM SR hop behind Service pca-semantic-router. Local Qwen is injected
# from model.id; models[] is extras only. Set both enable flags together.
semanticRouter: &semanticRouter
  enabled: false
  replicas: 1
  extproc:
    image: ghcr.io/vllm-project/semantic-router/extproc:v0.3.0
  envoy:
    image: envoyproxy/envoy:v1.34.4
  embedding:
    model: sentence-transformers/all-MiniLM-L6-v2
  keywords:
    code:
      - implement
      - refactor
      - debug
      - function
      - class
      - python
      - javascript
      - typescript
      - golang
      - code
  models: []
  modelsJson: ""
  apiKeysJson: {}
# Guardrails subchart reads global.semanticRouter.enabled (Helm global pass-through).
# Keep equal to semanticRouter.enabled. Enable:
#   --set semanticRouter.enabled=true,global.semanticRouter.enabled=true
global:
  semanticRouter: *semanticRouter
# Observability (pca-observability subchart)
# Installs when observability.enabled (default true because grafana.enabled defaults true).
# Set observability.enabled=false to skip the entire subchart.
observability:
  enabled: true
# Top-level grafana.enabled is unused by parent templates (subchart reads pca-observability.grafana).
grafana:
  enabled: true
pca-observability:
  # Inherit AI serving namespace (Makefile / --set also set this)
  namespace: ai-serving
  grafana:
    enabled: true
  # Single source of truth for Langfuse (parent LLMInferenceService + subchart stack)
  langfuse:
    enabled: false
    # metadata = tokens/latency via OTEL only; full = also store prompt/completion via vLLM middleware
    ioCapture: full
  prometheus:
    # ROSA full provision: cluster. Existing OpenShift override: namespace.
    accessMode: cluster
  cost:
    # PLACEHOLDER — illustrative L40S on-demand from sizing doc; not billing truth
    gpuHourlyUsd: 1.86
    gpuHourlyUsdIsPlaceholder: true
  persistence:
    storageClass: ""
    postgresSize: 10Gi
    clickhouseSize: 20Gi
# Guardrails (pca-guardrails subchart) — proxy, orchestrator, detectors.
guardrails:
  enabled: true
pca-guardrails:
  namespace: ai-serving
  llmdGatewayService: llm-d-gateway-data-science-gateway-class
  guardrails:
    enforcement: block
    llmService:
      # Empty: llm-d HTTP :80, or pca-semantic-router when global.semanticRouter.enabled.
      host: ""
      port: 80
      tlsSecret: ""
    replicas: 1
    gateway:
      enabled: false
    proxy:
      enabled: true
    detectors:
      promptInjection:
        enabled: true
        model: protectai/deberta-v3-base-prompt-injection-v2
        threshold: 0.5
        useGpu: false
      piiRegex:
        enabled: true
      secretsRegex:
        enabled: true
    otel:
      enabled: false
