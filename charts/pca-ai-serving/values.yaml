namespace: ai-serving
clusterResources: true
model:
  id: "Qwen/Qwen3.6-35B-A3B-FP8"
  servedName: "" # empty = use model.id as the vLLM --served-model-name
  name: "qwen3-coder"
  poolName: "qwen3-coder-inference-pool"
  # InferenceService (useCustomRuntime) creates <name>-predictor:80.
  # LLMInferenceService path uses kserve-workload-svc:8000 — keep these paired with useCustomRuntime.
  workloadServiceSuffix: "predictor"
  workloadServicePort: 80
# Shared token budgets (vLLM --max-model-len + IDE/OpenCode completion caps).
# Keep OpenCode/Continue limits in pca-devspaces aligned with these values.
tokens:
  total: 32000 # context window / --max-model-len
  output: 8192 # max completion tokens (must be < total)
vllm:
  # Deprecated alias: templates prefer tokens.total. Kept for --set compatibility.
  maxModelLen: ""
  toolCallParser: "qwen3_xml"
  reasoningParser: "qwen3"
  image: "vllm/vllm-openai:v0.19.0"
  # Writable cache dirs for non-root containers (custom runtime / upstream vLLM image).
  extraEnv:
    HF_HOME: "/model-cache"
    # Ignored at render time: templates set HF_HUB_OFFLINE from model-cache PVC
    # lookup (missing → "0" cold, exists → "1" warm). Kept for docs / --set clarity.
    HF_HUB_OFFLINE: "0"
    TRITON_CACHE_DIR: "/model-cache/triton-cache"
    XDG_CACHE_HOME: "/model-cache/xdg-cache"
    HOME: "/tmp"
    DG_JIT_CACHE_DIR: "/model-cache/deep-gemm"
    VLLM_CACHE_ROOT: "/model-cache/vllm-cache"
    # Companion to FULL_DECODE_ONLY cudagraphs in extraArgs — reduces fragmentation
    # OOM during capture on 48GB (ROSA L40S / existing OpenShift); harmless on H100.
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # Set true when RHOAI bundled vLLM doesn't support the model architecture.
  # Renders ServingRuntime + InferenceService instead of LLMInferenceService.
  # Requires vllm.image to be set. Qwen3.6 needs vLLM >= 0.18.
  useCustomRuntime: true
  # Set false to disable Qwen3 thinking mode (adds --chat-template-kwargs).
  # Use false when the model's thinking blocks exceed test max_tokens budgets.
  enableThinking: true
  # Optional vLLM --gpu-memory-utilization (empty = vLLM default).
  gpuMemoryUtilization: ""
  # FP8 KV cache (custom runtime + LLMInferenceService). Frees VRAM vs auto/fp16 KV.
  kvCacheDtype: "fp8"
  # Extra vLLM CLI args (appended after chart defaults on both ServingRuntime
  # and LLMInferenceService). Shared by ROSA / ARO / existing OpenShift.
  # Qwen3.6 hybrid (Mamba) needs max-num-batched-tokens >= block_size (~2096).
  # FULL_DECODE_ONLY + capped capture size: avoids full-cudagraph OOM on 48GB
  # (L40S); still valid on larger GPUs (e.g. ARO H100).
  extraArgs:
    - --max-num-batched-tokens=16384
    - --performance-mode=throughput
    - '--compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":32}'
hardware:
  gpuProduct: "g6e.2xlarge"
  instanceTypeLabel: "node.kubernetes.io/instance-type"
  gpuCount: 1
  cpu:
    request: "2"
    limit: "4"
  memory:
    request: 16Gi
    limit: 48Gi
storage:
  storageClass: "gp3-csi"
  modelCacheSize: 100Gi
epp:
  enabled: false
tlsJob:
  enabled: false
  gatewayHostname: ""
gatewayName: llm-d-gateway
# RHCL AI Gateway in front of llm-d (auth + future multi-destination / quotas).
# Does not replace llm-d-gateway / EPP / InferencePool.
aiGateway:
  enabled: true
  name: pca-ai-gateway
  gatewayClassName: data-science-gateway-class
  # When true, DevSpaces IDEs skip RHCL and call llm-d directly (break-glass).
  escapeHatchToLlmd: false
  tls:
    secretName: qwen3-coder-kserve-self-signed-certs
  # ROSA/ARO: pca-operators already owns Namespace + Kuadrant CR (default false).
  # Existing OpenShift: override create=true (see deploy_existing_openshift/values-ai-serving.yaml).
  kuadrant:
    create: false
    namespace: kuadrant-system
    name: kuadrant
  backends:
    local:
      enabled: true
    # Phase-1 stubs — enable later and route by OpenAI model name.
    otherCluster:
      enabled: false
      url: ""
    external:
      enabled: false
      url: ""
  # Follow-up: RateLimitPolicy / TokenRateLimitPolicy (not enforced in Phase 1).
  rateLimits:
    enabled: false
  # Follow-up: scale the front-door Gateway Deployment (not enforced in Phase 1).
  ha:
    replicas: 1
# Observability (pca-observability subchart)
# Installs when observability.enabled (default true because grafana.enabled defaults true).
# Set observability.enabled=false to skip the entire subchart.
observability:
  enabled: true
# Top-level grafana.enabled is unused by parent templates (subchart reads pca-observability.grafana).
grafana:
  enabled: true
pca-observability:
  # Inherit AI serving namespace (Makefile / --set also set this)
  namespace: ai-serving
  grafana:
    enabled: true
  # Single source of truth for Langfuse (parent LLMInferenceService + subchart stack)
  langfuse:
    enabled: false
    # metadata = tokens/latency via OTEL only; full = also store prompt/completion via vLLM middleware
    ioCapture: full
  prometheus:
    # ROSA full provision: cluster. Existing OpenShift override: namespace.
    accessMode: cluster
  cost:
    # PLACEHOLDER — illustrative L40S on-demand from sizing doc; not billing truth
    gpuHourlyUsd: 1.86
    gpuHourlyUsdIsPlaceholder: true
  persistence:
    storageClass: ""
    postgresSize: 10Gi
    clickhouseSize: 20Gi
