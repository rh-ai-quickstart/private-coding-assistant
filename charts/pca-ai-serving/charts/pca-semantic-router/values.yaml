namespace: ai-serving
# Must match parent pca-ai-serving.llmdGatewayService when local.baseUrl is empty.
llmdGatewayService: llm-d-gateway-data-science-gateway-class
semanticRouter:
  replicas: 1
  routeMode: pin-local
  localModel: ""
  autoKeywords: "code,function,class,implement,refactor,debug,complete,python,javascript,typescript,golang,rust"
  local:
    # llm-d HTTP :80 OpenAI base (no trailing slash beyond /v1).
    baseUrl: ""
  external:
    baseUrl: ""
    models: ""
    secretName: pca-semantic-router-external
    secretKey: api-key
