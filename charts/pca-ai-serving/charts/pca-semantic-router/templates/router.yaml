{{- if .Values.semanticRouter }}
{{- $ns := .Values.namespace }}
{{- $svc := .Values.llmdGatewayService | default "llm-d-gateway-data-science-gateway-class" }}
{{- $llmd := printf "http://%s.%s.svc.cluster.local:80/v1" $svc $ns }}
{{- $local := .Values.semanticRouter.local.baseUrl | default $llmd }}
{{- $ext := .Values.semanticRouter.external | default dict }}
{{- $secretName := $ext.secretName | default "pca-semantic-router-external" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pca-semantic-router-script
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  sse_http.py: |
{{ .Files.Get "files/sse_http.py" | indent 4 }}
  semantic_router.py: |
{{ .Files.Get "files/semantic_router.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pca-semantic-router
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: pca-semantic-router
spec:
  replicas: {{ .Values.semanticRouter.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pca-semantic-router
  template:
    metadata:
      annotations:
        checksum/script: {{ .Files.Get "files/semantic_router.py" | sha256sum }}
        checksum/sse-http: {{ .Files.Get "files/sse_http.py" | sha256sum }}
      labels:
        app.kubernetes.io/name: pca-semantic-router
    spec:
      containers:
        - name: router
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/semantic_router.py"]
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_PORT
              value: "8080"
            - name: LOCAL_BASE_URL
              value: {{ $local | quote }}
            - name: ROUTE_MODE
              value: {{ .Values.semanticRouter.routeMode | default "pin-local" | quote }}
            - name: LOCAL_MODEL
              value: {{ .Values.semanticRouter.localModel | default "" | quote }}
            - name: AUTO_KEYWORDS
              value: {{ .Values.semanticRouter.autoKeywords | default "code,function,class,implement,refactor,debug,complete,python,javascript,typescript,golang,rust" | quote }}
            - name: EXTERNAL_BASE_URL
              value: {{ $ext.baseUrl | default "" | quote }}
            - name: EXTERNAL_MODELS
              value: {{ $ext.models | default "" | quote }}
            - name: EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $ext.secretKey | default "api-key" }}
                  optional: true
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: pca-semantic-router-script
---
apiVersion: v1
kind: Service
metadata:
  name: pca-semantic-router
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: pca-semantic-router
spec:
  selector:
    app.kubernetes.io/name: pca-semantic-router
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: api
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pca-semantic-router
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: pca-semantic-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pca-semantic-router
  endpoints:
    - port: api
      path: /metrics
      interval: 30s
{{- end }}
