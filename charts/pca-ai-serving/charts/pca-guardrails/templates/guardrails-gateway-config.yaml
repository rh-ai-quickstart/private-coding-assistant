apiVersion: v1
kind: ConfigMap
metadata:
  name: pca-guardrails-gateway-config
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.yaml: |
    orchestrator:
      host: "localhost"
      port: 8032
    detectors:
      {{- if .Values.guardrails.detectors.promptInjection.enabled }}
      - name: prompt_injection
        input: true
        output: false
        detector_params: {}
      {{- end }}
      {{- if or .Values.guardrails.detectors.piiRegex.enabled .Values.guardrails.detectors.secretsRegex.enabled }}
      - name: regex
        input: true
        output: false
        detector_params:
          regex:
            {{- $pii := .Values.guardrails.detectors.piiRegex | default dict -}}
            {{- if ($pii.enabled | default false) -}}
            {{- range ($pii.detectors | default list) }}
            - {{ . | quote }}
            {{- end -}}
            {{- end -}}
            {{- $secrets := .Values.guardrails.detectors.secretsRegex | default dict -}}
            {{- if ($secrets.enabled | default false) -}}
            {{- $secretFile := fromYaml (.Files.Get "files/secret-patterns.yaml") -}}
            {{- range ($secretFile.patterns | default list) }}
            - {{ . | quote }}
            {{- end -}}
            {{- range ($secrets.extraPatterns | default list) }}
            - {{ . | quote }}
            {{- end -}}
            {{- end -}}
      {{- end }}
    routes:
      - name: guardrailed
        detectors:
          {{- if .Values.guardrails.detectors.promptInjection.enabled }}
          - prompt_injection
          {{- end }}
          {{- if or .Values.guardrails.detectors.piiRegex.enabled .Values.guardrails.detectors.secretsRegex.enabled }}
          - regex
          {{- end }}
      - name: passthrough
        detectors:
