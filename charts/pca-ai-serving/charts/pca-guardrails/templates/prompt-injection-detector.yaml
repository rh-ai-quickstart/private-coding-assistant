{{- if .Values.guardrails.detectors.promptInjection.enabled }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ include "guardrails.promptInjectionServiceName" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Must stay in the same sync-wave as detector-model-cache-pvc.yaml (wave 0).
    # The PVC uses WaitForFirstConsumer binding, so it can only reach Bound once
    # this InferenceService's pod is scheduled and mounts it. If this resource is
    # deployed in a *later* wave than the PVC, ArgoCD waits for the PVC to become
    # Healthy (Bound) before applying this wave — but the PVC never binds without
    # this pod, and this pod is never created until the PVC's wave is healthy.
    # That's a permanent deadlock. Keeping both in wave 0 lets them apply together
    # so the pod can trigger the PVC bind. See model-cache + LLMInferenceService in
    # charts/pca-ai-serving/templates/pvcs.yaml, which follow the same same-wave rule.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    app.kubernetes.io/name: {{ include "guardrails.promptInjectionServiceName" . }}
    app.kubernetes.io/component: guardrails-detector
spec:
  predictor:
    model:
      modelFormat:
        name: guardrails-detector-hf-runtime
      runtime: guardrails-detector-huggingface-runtime
      storageUri: "hf://{{ .Values.guardrails.detectors.promptInjection.model }}"
      resources:
        requests:
          {{- if .Values.guardrails.detectors.promptInjection.useGpu }}
          cpu: "1"
          memory: 2Gi
          nvidia.com/gpu: "1"
          {{- else }}
          cpu: "2"
          memory: 2Gi
          {{- end }}
        limits:
          {{- if .Values.guardrails.detectors.promptInjection.useGpu }}
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
          {{- else }}
          cpu: "4"
          memory: 4Gi
          {{- end }}
    volumes:
      - name: kserve-provision-location
        persistentVolumeClaim:
          claimName: detector-model-cache
    {{- if .Values.guardrails.detectors.promptInjection.useGpu }}
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    {{- end }}
{{- end }}
