# PCA overrides for gitleaks-derived guardrails secret patterns.
# After editing, run: make sync-guardrails-patterns
#
# add: extra regex patterns (Python re syntax) merged after gitleaks extraction
# remove: exact regex strings to drop (must match extracted pattern after normalization)

add:
  - '\bsk-ant-[A-Za-z0-9\-_]{20,}\b'
remove:
  - "(?i)[\\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([\\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"
