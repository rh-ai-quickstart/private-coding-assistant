# PCA overrides for gitleaks-derived guardrails secret patterns.
# After editing, run: make sync-guardrails-patterns
#
# add: extra regex patterns (Python re syntax) merged after gitleaks extraction
# remove_ids: gitleaks rule ids to skip (preferred over exact-regex remove)
# remove: exact regex strings to drop (must match extracted pattern byte-for-byte)

add:
  - '\bsk-ant-[A-Za-z0-9\-_]{20,}\b'
remove_ids:
  - generic-api-key
