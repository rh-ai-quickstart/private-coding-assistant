apiVersion: v2
name: pca-observability
version: 0.1.0
description: PCA Observability — Grafana (ops metrics) + optional Langfuse/OTel Collector (LLM traces)
dependencies:
  - name: langfuse
    version: "1.5.38"
    repository: https://langfuse.github.io/langfuse-k8s
    condition: langfuse.enabled
  # Object storage for Langfuse
  - name: aws-compatible-storage
    version: "0.2.0"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: aws-compatible-storage.enabled,langfuse.enabled
