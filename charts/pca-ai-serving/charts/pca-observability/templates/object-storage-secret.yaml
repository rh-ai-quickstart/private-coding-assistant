{{- if .Values.langfuse.enabled }}
{{- $ns := include "pca-observability.namespace" . -}}
{{- $secretName := "pca-langfuse-s3-credentials" -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}

{{- $creds := .Values.langfuse.credentials | default dict -}}
{{- $accessKeyId := $creds.s3AccessKeyId | default "" -}}
{{- $secretAccessKey := $creds.s3RootPassword | default "" -}}

{{- if $existing -}}
  {{- if and (not $accessKeyId) (index $existing.data "AWS_ACCESS_KEY_ID") -}}{{- $accessKeyId = index $existing.data "AWS_ACCESS_KEY_ID" | b64dec -}}{{- end -}}
  {{- if and (not $secretAccessKey) (index $existing.data "AWS_SECRET_ACCESS_KEY") -}}{{- $secretAccessKey = index $existing.data "AWS_SECRET_ACCESS_KEY" | b64dec -}}{{- end -}}
{{- end -}}

{{- if not $accessKeyId -}}{{- $accessKeyId = "s4admin" -}}{{- end -}}
{{- if not $secretAccessKey -}}{{- $secretAccessKey = randAlphaNum 24 -}}{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: pca-langfuse-s3
    app.kubernetes.io/part-of: pca-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secretAccessKey | quote }}
{{- end }}
