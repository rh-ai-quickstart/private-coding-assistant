{{- if .Values.grafana.enabled }}
{{- $ns := include "pca-observability.namespace" . -}}
{{- $gpu := .Values.cost.gpuHourlyUsd -}}
{{- $ph := .Values.cost.gpuHourlyUsdIsPlaceholder -}}
{{- $gpuDs := "prometheus" -}}
{{- if eq .Values.prometheus.accessMode "namespace" -}}
{{- $gpuDs = "prometheus-gpu" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pca-grafana-dashboard-c
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: pca-grafana
    app.kubernetes.io/part-of: pca-observability
data:
  board-c.json: |
    {
      "uid": "pca-board-c",
      "title": "PCA C — Capacity / KV / GPU",
      "tags": ["pca", "capacity", "gpu", "kv"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "KV cache usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "avg(vllm:kv_cache_usage_perc) or avg(vllm_kv_cache_usage_perc) or avg(vllm_gpu_cache_usage_perc)",
              "legendFormat": "kv usage"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } }
        },
        {
          "type": "timeseries",
          "title": "GPU util % (DCGM)",
          "description": "Live avg util plus peak over the last 5m. Same intent as the performance ladder GPU peak %, but sampled from DCGM (not nvidia-smi during a stage).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "{{ $gpuDs }}" },
          "targets": [
            {
              "expr": "avg(DCGM_FI_DEV_GPU_UTIL) or avg(nvidia_gpu_duty_cycle)",
              "legendFormat": "GPU util %"
            },
            {
              "expr": "max_over_time((avg(DCGM_FI_DEV_GPU_UTIL) or avg(nvidia_gpu_duty_cycle))[5m:30s])",
              "legendFormat": "GPU util peak % (last 5m)"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "GPU memory used",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "{{ $gpuDs }}" },
          "targets": [
            {
              "expr": "avg(DCGM_FI_DEV_FB_USED) or avg(nvidia_gpu_memory_used_bytes)",
              "legendFormat": "FB used"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "In-flight / queued requests",
          "description": "Live vLLM concurrency gauges (not OpenCode model-step counts from the performance ladder).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_running) or sum(vllm_num_requests_running)",
              "legendFormat": "in-flight"
            },
            {
              "expr": "sum(vllm:num_requests_waiting) or sum(vllm_num_requests_waiting)",
              "legendFormat": "queued"
            }
          ]
        },
        {
          "type": "stat",
          "title": "PLACEHOLDER — GPU $/hr context (override per cluster)",
          "description": "Illustrative L40S on-demand from sizing doc — NOT billing truth. Set cost.gpuHourlyUsd / cost.gpuHourlyUsdIsPlaceholder in values.",
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 16 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "{{ $gpu }}",
              "instant": true,
              "legendFormat": "{{ if $ph }}PLACEHOLDER {{ end }}$/hr"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Prefix cache hit rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(vllm:gpu_prefix_cache_hits[5m])) / clamp_min(sum(rate(vllm:gpu_prefix_cache_queries[5m])), 1) or sum(rate(vllm_gpu_prefix_cache_hits_total[5m])) / clamp_min(sum(rate(vllm_gpu_prefix_cache_queries_total[5m])), 1)",
              "legendFormat": "hit rate"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } }
        },
        {
          "type": "timeseries",
          "title": "Output vs all tokens/s",
          "description": "Output = vLLM generation (decode) tokens only — same token kind as the performance ladder output tok/s. All = prompt + output. This panel is a rolling 5m Prometheus rate (engine-wide); the ladder divides stage output tokens by OpenCode makespan.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(vllm:generation_tokens_total[5m])) or sum(rate(vllm_generation_tokens_total[5m]))",
              "legendFormat": "output tok/s"
            },
            {
              "expr": "(sum(rate(vllm:prompt_tokens_total[5m])) + sum(rate(vllm:generation_tokens_total[5m]))) or (sum(rate(vllm_prompt_tokens_total[5m])) + sum(rate(vllm_generation_tokens_total[5m])))",
              "legendFormat": "all tok/s (prompt + output)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "vLLM completions/min",
          "description": "Finished vLLM inference requests per minute. Not the same as OpenCode model steps (LLM calls) in the performance ladder.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "60 * (sum(rate(vllm:request_success_total[5m])) or sum(rate(vllm_request_success_total[5m])))",
              "legendFormat": "vLLM completions/min"
            }
          ]
        }
      ]
    }
{{- end }}
