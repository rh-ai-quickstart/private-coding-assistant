# ROSA-specific overrides — model/vLLM/hardware inherit from base values.yaml.
hardware:
  instanceTypeLabel: "node.kubernetes.io/instance-type"
storage:
  storageClass: "gp3-csi"
observability:
  enabled: true
pca-observability:
  grafana:
    enabled: true
  langfuse:
    enabled: false
  prometheus:
    accessMode: cluster
