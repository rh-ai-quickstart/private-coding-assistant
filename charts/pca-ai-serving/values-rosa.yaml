model:
  id: "Qwen/Qwen3.6-35B-A3B-FP8"
  name: "qwen3-coder"
  poolName: "qwen3-coder-inference-pool"
tokens:
  total: 32000
  output: 8192
vllm:
  reasoningParser: "qwen3"
hardware:
  gpuProduct: "g6e.2xlarge"
  instanceTypeLabel: "node.kubernetes.io/instance-type"
  gpuCount: 1
  cpu:
    request: "2"
    limit: "4"
  memory:
    request: 16Gi
    limit: 48Gi
storage:
  storageClass: "gp3-csi"
  modelCacheSize: 100Gi
# LLMInferenceService no longer auto-creates the kserve self-signed cert
# secret that both Gateways' listeners reference by default, so without this
# job neither Gateway's HTTPS listener ever programs (envoy refuses
# connections on 443 with "invalid certificate reference"). See ARO's and
# deploy_existing_openshift's values files, which already carry this fix.
tlsJob:
  enabled: true
observability:
  enabled: true
pca-observability:
  grafana:
    enabled: true
  langfuse:
    enabled: false
  prometheus:
    accessMode: cluster
