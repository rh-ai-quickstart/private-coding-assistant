gitops:
  repoURL: "__overridden_at_deploy_time__"
  targetRevision: main
  basePath: "__overridden_at_deploy_time__"
  cloud: ""
hfToken:
  raw: "__overridden_at_deploy_time__"
# Model selection — forwarded to pca-ai-serving's model.variant and
# pca-devspaces' modelVariant (Terraform's model_variant sets both from a
# single source of truth). "qwen3.6" matches both charts' own defaults, so
# this is a safe no-op for Helm-only installs of this chart that skip Terraform.
aiServing:
  modelVariant: "qwen3.6"
  # Empty = do not --set enable flags (ROSA overlay stays on, ARO stays off).
  semanticRouterEnabled: ""
  semanticRouterModelsJson: "[]"
  semanticRouterApiKeysJson: "{}"
devSpaces:
  modelVariant: "qwen3.6"
